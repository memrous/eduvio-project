; php-fpm for the Eduvio API container: replaces the image's www.conf and zz-docker.conf.
; Sized for Render's free plan (512 MB RAM): at most 4 workers, started on demand and
; stopped again after 10 s of idleness, so the container stays small while idle.

[global]
daemonize = no
error_log = /proc/self/fd/2
pid = /tmp/php-fpm.pid
log_limit = 8192

[www]
; Runs as the container user ("app"); no user/group switch
listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Laravel logs to php://stderr (LOG_CHANNEL=stderr): pass it to the container log
catch_workers_output = yes
decorate_workers_output = no
; Keep the container environment (APP_KEY, DB_*, ...) available to PHP
clear_env = no

access.log = /dev/null

; Production PHP settings for the Eduvio API container

expose_php = Off
memory_limit = 128M
max_execution_time = 120

; Materials may have up to 50 MB (validation: max:51200)
upload_max_filesize = 50M
post_max_size = 55M

log_errors = On
error_log = /proc/self/fd/2
display_errors = Off

; OPcache: code never changes inside the image, so no timestamp checks
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
; JIT off: no gain for this I/O-bound app, only extra memory
opcache.jit = disable
opcache.jit_buffer_size = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

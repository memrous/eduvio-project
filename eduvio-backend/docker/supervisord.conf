; One container runs everything (Render free plan = one service):
; web (nginx + php-fpm), queue worker and scheduler. A process that dies is restarted.
; All output goes to the container log (stdout / stderr).

[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid
loglevel = warn

; nginx and php-fpm: workers orphaned by a crashed master would keep the port and block
; the restart ("Address in use"), so leftovers are stopped before each start.
; ("[p]hp" / "[n]ginx": the pattern must not match this sh command line itself.)

[program:php-fpm]
command = /bin/sh -c 'pkill -f "[p]hp-fpm: pool" || true; exec php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf'
autorestart = true
startretries = 10
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
; -e stderr: also the log nginx opens before reading its config
command = /bin/sh -c 'pkill -f "[n]ginx: worker process" || true; exec nginx -e stderr -c /tmp/nginx.conf -g "daemon off;"'
autorestart = true
startretries = 10
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:queue]
; Ends itself after an hour or at 128 MB and is started again (keeps memory in check)
command = php /var/www/html/artisan queue:work --sleep=10 --tries=1 --max-time=3600 --memory=128
autorestart = true
startsecs = 0
stopwaitsecs = 120
priority = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:scheduler]
command = php /var/www/html/artisan schedule:work
autorestart = true
priority = 40
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
